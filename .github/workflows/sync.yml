name: Build README

on:
  push:
    branches: [main]
    paths:
      - "questions/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build README
        run: python scripts/sync.py

      - name: Commit and push
        run: |
          git config user.name "LiSiruiRay"
          git config user.email "sl9625@nyu.edu"
          git add README.md
          git diff --cached --quiet || git commit -m "sync: rebuild README $(date -u +%Y-%m-%d)"
          git push
